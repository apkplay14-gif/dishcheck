name: StarlinkReader

options:
  bundleIdPrefix: com.dishcheck
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.102.0
  SwiftNIOHTTP2:
    url: https://github.com/apple/swift-nio-http2.git
    exactVersion: 1.46.0
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.9.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0

targets:
  StarlinkReader:
    type: application
    platform: iOS
    sources:
      - path: StarlinkReader
        excludes:
          - "Info.plist"
    resources:
      - path: StarlinkReader/Resources
      - path: StarlinkReader/Assets.xcassets
    info:
      path: StarlinkReader/Info.plist
      properties:
        CFBundleDisplayName: "Є Starlink"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - uk
          - pl
          - es
          - de
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Камера потрібна для сканування QR-кодів і штрихкодів на коробці комплекту Starlink."
        NSLocalNetworkUsageDescription: "Додаток читає ідентифікатор і MAC-адресу тарілки та роутера Starlink у вашій локальній Wi-Fi мережі."
        NSUserTrackingUsageDescription: "Ідентифікатор пристрою використовується рекламним SDK для показу релевантної реклами."
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
