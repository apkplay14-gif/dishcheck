      base:
        PRODUCT_NAME: StarlinkReader
        PRODUCT_BUNDLE_IDENTIFIER: com.dishcheck.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIOHTTP2
        product: NIOHTTP2
      - package: SwiftNIOHTTP2
        product: NIOHPACK
      - package: SwiftProtobuf
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform

schemes:
  StarlinkReader:
    build:
      targets:
        StarlinkReader: all
    run:
      config: Release
